x-app: &app
  user: "${HOST_UID}:${HOST_GID}"
  networks:
    - network

services:
  ai:
    <<: *app
    build:
      context: .
      dockerfile: containers/ai/local/Dockerfile
    working_dir: /ai
    volumes:
      - .:/ai
    env_file: .env.ai.local
    command: /bin/bash -c "
      bash"
    tty: true
    stdin_open: true

networks:
  network:
